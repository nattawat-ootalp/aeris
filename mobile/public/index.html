<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <title>NextAir — ติดตามการรับสัมผัสสิ่งแวดล้อมส่วนบุคคล</title>
    <meta
      name="description"
      content="NextAir ติดตามการรับสัมผัสมลพิษทางอากาศระดับบุคคล และให้ข้อมูลประกอบการตัดสินใจที่อธิบายได้ ไม่ใช่เครื่องมือแพทย์ ไม่วินิจฉัยโรค"
    />
    <meta name="theme-color" content="#0D9488" />
    <meta name="color-scheme" content="light" />

    <!-- Add-to-home-screen: the site behaves like the app it is built from. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NextAir" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NextAir" />
    <meta property="og:title" content="NextAir — Personal Environmental Exposure & Decision Support" />
    <meta
      property="og:description"
      content="Individual exposure tracking and explainable, non-diagnostic decision support. Not a medical device."
    />
    <meta property="og:image" content="/nextair-icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <style id="expo-reset">
      /* react-native-web root reset (https://necolas.github.io/react-native-web/docs/setup/) */
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #f4f6fb;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        background: #f4f6fb;
      }

      /* #root deliberately has no max-width. A wide viewport is handled inside the app
         (src/lib/responsive.ts): past 720px the tab bar becomes a left rail and each screen
         caps its own text column, so the page uses the whole window without any line running
         the full width of a monitor. Framing the app in a fixed 460px card here instead would
         also freeze the phone layout on a desktop, which is what it used to do. */

      /* Pre-hydration splash: the JS bundle is ~1.7 MB, so without this the visitor stares at
         a blank page on a slow connection. Removed automatically once React mounts into #root. */
      #aeris-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6fb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #0d9488;
        transition: opacity 0.25s ease;
      }
      #root:not(:empty) + #aeris-boot {
        opacity: 0;
        pointer-events: none;
      }
      noscript {
        display: block;
        padding: 32px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #0f172a;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <noscript>NextAir ต้องใช้ JavaScript — กรุณาเปิดใช้งาน JavaScript ในเบราว์เซอร์ของคุณ</noscript>
    <div id="root"></div>
    <div id="aeris-boot" aria-hidden="true">NextAir</div>
  </body>
</html>
