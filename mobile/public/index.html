<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <title>Aeris — ติดตามการรับสัมผัสสิ่งแวดล้อมส่วนบุคคล</title>
    <meta
      name="description"
      content="Aeris ติดตามการรับสัมผัสมลพิษทางอากาศระดับบุคคล และให้ข้อมูลประกอบการตัดสินใจที่อธิบายได้ ไม่ใช่เครื่องมือแพทย์ ไม่วินิจฉัยโรค"
    />
    <meta name="theme-color" content="#0D9488" />
    <meta name="color-scheme" content="light" />

    <!-- Add-to-home-screen: the site behaves like the app it is built from. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aeris" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aeris" />
    <meta property="og:title" content="Aeris — Personal Environmental Exposure & Decision Support" />
    <meta
      property="og:description"
      content="Individual exposure tracking and explainable, non-diagnostic decision support. Not a medical device."
    />
    <meta property="og:image" content="/aeris-icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <style id="expo-reset">
      /* react-native-web root reset (https://necolas.github.io/react-native-web/docs/setup/) */
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        /* Backdrop shown around the app frame on wide screens. */
        background: radial-gradient(120% 120% at 50% 0%, #eaf2f1 0%, #e6eaf2 55%, #dfe4ee 100%);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        background: #f4f6fb;
      }

      /* The Aeris UI is a phone layout. Stretching it edge-to-edge on a monitor makes every
         row a metre wide and unreadable, so on wide viewports we centre it in a device-width
         frame instead. Below this breakpoint the app fills the screen exactly as on mobile. */
      @media (min-width: 700px) {
        body {
          overflow: auto;
        }
        #root {
          width: 100%;
          max-width: 460px;
          margin: 0 auto;
          box-shadow: 0 24px 70px rgba(15, 23, 42, 0.16), 0 2px 8px rgba(15, 23, 42, 0.06);
        }
      }
      @media (min-width: 700px) and (min-height: 900px) {
        #root {
          height: calc(100% - 48px);
          margin: 24px auto;
          border-radius: 28px;
          overflow: hidden;
        }
      }

      /* Pre-hydration splash: the JS bundle is ~1.7 MB, so without this the visitor stares at
         a blank page on a slow connection. Removed automatically once React mounts into #root. */
      #aeris-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6fb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #0d9488;
        transition: opacity 0.25s ease;
      }
      #root:not(:empty) + #aeris-boot {
        opacity: 0;
        pointer-events: none;
      }
      noscript {
        display: block;
        padding: 32px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #0f172a;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <noscript>Aeris ต้องใช้ JavaScript — กรุณาเปิดใช้งาน JavaScript ในเบราว์เซอร์ของคุณ</noscript>
    <div id="root"></div>
    <div id="aeris-boot" aria-hidden="true">Aeris</div>
  </body>
</html>
