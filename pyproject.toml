[project]
name = "aeris"
version = "0.1.0"
description = "Aeris — personal environmental exposure & decision support (free stack)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["intelligence/tests", "ingestion/tests", "core_api/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: long Thai comments allowed. B008: FastAPI requires Depends()/Query() in defaults.
ignore = ["E501", "B008"]
