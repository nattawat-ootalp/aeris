# Aeris web — Netlify config (alternative to vercel.json; use whichever host you connect).
#
# The published site IS the Expo app (mobile/) exported through react-native-web. Native-only
# modules resolve to their .web shims at bundle time (src/lib/ble.web.ts,
# src/components/LongdoMap.web.tsx) — see docs/WEB.md.

[build]
  base = "mobile"
  command = "npm install && npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # EXPO_PUBLIC_* values are set in the Netlify UI (Site settings -> Environment variables),
  # not here — they are baked into the bundle at build time and this file is public.

# Single-page app: every route in src/navigation/linking.ts is served by the same shell, so a
# reload or a shared deep link resolves instead of 404-ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(self), bluetooth=(self), camera=(), microphone=()"
